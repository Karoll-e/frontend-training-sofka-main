<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BankPro</title>
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
    <!-- Google Material Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/register.css">
</head>
<body>
    <div class="register-container">
        <!-- Left Side - Image -->
        <div class="register-image-section">
            <img src="assets/register-img.png" alt="Register Illustration" class="register-illustration">
        </div>

        <!-- Right Side - Register Form -->
        <div class="register-form-section">
            <div class="logo-section">
                <div class="logo">
                    <img src="assets/logo.png" alt="BankPro Logo" class="logo-icon">
                    <span>BankPro</span>
                </div>
            </div>
           
            <div class="form-container">
                <div class="welcome-text">
                    <h2>Crear cuenta</h2>
                    <p>Completa tus datos para comenzar</p>
                </div>
               
                <form class="register-form" id="registerForm">
                    <div class="input-group">
                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            placeholder="Nombre completo"
                            
                        >
                        <span class="error-message" id="fullNameError"></span>
                    </div>

                    <div class="input-group">
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Correo electrónico"
                            
                        >
                        <span class="error-message" id="emailError"></span>
                    </div>
                   
                    <div class="input-group">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Contraseña"
                            
                        >
                        <span class="error-message" id="passwordError"></span>
                    </div>

                    <div class="input-group">
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirmar contraseña"
                            
                        >
                        <span class="error-message" id="confirmPasswordError"></span>
                    </div>

                   
                    <button type="submit" class="btn btn-get-started">
                        Crear Cuenta
                    </button>
                </form>
               
                <div class="signin-link">
                    <p>¿Ya tienes cuenta? <a href="login.html" class="signin-text">Inicia sesión</a></p>
                </div>
            </div>
        </div>
    </div>
   
    <script src="js/formValidation.js"></script>
</body>
</html>
