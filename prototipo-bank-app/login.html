<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BankPro</title>
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <!-- Left Side - Login Form -->
        <div class="login-form-section">
            <div class="logo-section">
                <div class="logo">
                    <img src="assets/logo.png" alt="BankPro Logo" class="logo-icon">
                    <span>BankPro</span>
                </div>
            </div>
           
            <div class="form-container">
                <div class="welcome-text">
                    <h1>Hola,</h1>
                    <h2>Bienvenido de nuevo</h2>
                    <p>Ingresa tus credenciales para continuar</p>
                </div>
               
                <form class="login-form" id="loginForm">
                    <div class="input-group">
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Ingresa tu email"
                        >
                        <span class="error-message" id="emailError"></span>
                    </div>
                   
                    <div class="input-group">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Ingresa tu contraseña"
                        >
                        <span class="error-message" id="passwordError"></span>
                    </div>
                   
                    <button type="submit" class="btn btn-get-started">
                        Iniciar Sesión
                    </button>
                </form>
               
                <div class="signup-link">
                    <p>¿No tienes cuenta? <a href="register.html" class="signup-text">Regístrate</a></p>
                </div>
            </div>
        </div>
       
        <div class="login-image-section">
            <img src="assets/login-img.png" alt="Login Illustration" class="login-illustration">
        </div>
    </div>
   
    <script src="js/formValidation.js"></script>
</body>
</html>
